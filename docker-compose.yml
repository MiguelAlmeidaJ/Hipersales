services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      HIPERSALES_API_ORIGIN: http://hipersales:8000
    ports:
      - "3000:3000"
    depends_on:
      - hipersales

  hipersales:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      NODE_ENV: production
      LEGACY_API_ORIGIN: http://hipersales-legacy:8001
      HYPERSALES_DB_PATH: /app/database/hypersales.sqlite3
    volumes:
      - hipersales_database:/app/database
    ports:
      - "8000:8000"
    depends_on:
      hipersales-legacy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  hipersales-legacy:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api-legacy
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8001"
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Configure_EVOLUTION_API_KEY}
      HYPERSALES_DB_PATH: /app/database/hypersales.sqlite3
    volumes:
      - hipersales_database:/app/database
    depends_on:
      - evolution
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10

  hipersales-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hipersales
      POSTGRES_USER: hipersales
      POSTGRES_PASSWORD: ${HIPERSALES_DB_PASSWORD:?Configure_HIPERSALES_DB_PASSWORD}
    volumes:
      - hipersales_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hipersales -d hipersales"]
      interval: 10s
      timeout: 5s
      retries: 10

  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Configure_EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Configure_EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: hipersales_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: hipersales_evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Configure_EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hipersales_postgres:
  hipersales_database:
  evolution_postgres:
  evolution_redis:
  evolution_instances:
  evolution_store:
