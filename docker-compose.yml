services:
  # Banco principal do HiperSales.
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${HIPERSALES_DATABASE_ADMIN_PASSWORD:-${HIPERSALES_SQLSERVER_SA_PASSWORD:?Configure_HIPERSALES_DATABASE_ADMIN_PASSWORD}}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - hipersales_database:/var/opt/mssql
    shm_size: "1gb"
    mem_limit: 3g

  evolution:
    image: evoapicloud/evolution-api:v2.2.3
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Configure_EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Configure_EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: hipersales_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: hipersales_evolution
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Configure_EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hipersales_database:
    name: hipermix_hipersales_sqlserver
  evolution_postgres:
  evolution_redis:
  evolution_instances:
  evolution_store:
