# SQL Server isolado para homologacao da migracao do Hipersales.
# Nao substitui PostgreSQL/Evolution nem executa cutover automaticamente.
# docker compose --env-file .env -f compose.sqlserver.yml up -d
services:
  hipersales-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hipersales-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${HIPERSALES_SQLSERVER_SA_PASSWORD:?Defina_HIPERSALES_SQLSERVER_SA_PASSWORD_no_env}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - hipersales_sqlserver_data:/var/opt/mssql
    shm_size: "1gb"
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true
volumes:
  hipersales_sqlserver_data:
