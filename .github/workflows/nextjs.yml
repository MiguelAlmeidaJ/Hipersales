name: HiperSales monorepo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      database:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: SqlServer-Test-123!
        ports:
          - 1433:1433
    env:
      HIPERSALES_DATABASE_ADMIN_PASSWORD: "SqlServer-Test-123!"
      SQLSERVER_DATABASE_URL: "sqlserver://127.0.0.1:1433;database=hipersales_test;user=sa;password={SqlServer-Test-123!};encrypt=false;trustServerCertificate=true"
      TEST_DATABASE_URL: "sqlserver://127.0.0.1:1433;database=hipersales_test;user=sa;password={SqlServer-Test-123!};encrypt=false;trustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      # Use an unfrozen install until pnpm-lock.yaml is generated and committed.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @hipersales/database test:database:create
      - run: pnpm prisma:migrate
      - run: pnpm run build:api
      - run: pnpm run test:api
      - run: pnpm run typecheck
      - run: pnpm run build:web
