name: HiperSales monorepo CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hipersales_test
          POSTGRES_USER: hipersales
          POSTGRES_PASSWORD: hipersales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hipersales -d hipersales_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hipersales:hipersales@localhost:5432/hipersales_test
      TEST_DATABASE_URL: postgresql://hipersales:hipersales@localhost:5432/hipersales_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      # Use an unfrozen install until pnpm-lock.yaml is generated and committed.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build:api
      - run: pnpm run test:api
      - run: pnpm run typecheck
      - run: pnpm run build:web
