name: Nest API checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hipersales_test
          POSTGRES_USER: hipersales
          POSTGRES_PASSWORD: hipersales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hipersales -d hipersales_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hipersales:hipersales@localhost:5432/hipersales_test
      TEST_DATABASE_URL: postgresql://hipersales:hipersales@localhost:5432/hipersales_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - run: npm run test:api
      - run: npm run typecheck --workspace @hipersales/api
      - run: npm ci --prefix apps/web
      - run: npm run typecheck --prefix apps/web
