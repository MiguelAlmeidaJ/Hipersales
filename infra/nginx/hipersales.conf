# HiperSales - reverse proxy HTTP. Certbot instala HTTPS após DNS apontar ao servidor.
# Mantenha API (3110), Web (3111) e bancos inacessíveis externamente.
server {
    listen 80;
    listen [::]:80;
    server_name web.hipersalesweb.com.br;
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name api.hipersalesweb.com.br;
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
